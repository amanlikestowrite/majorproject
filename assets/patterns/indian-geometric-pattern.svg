<svg xmlns="http://www.w3.org/2000/svg" width="40" height="20" viewBox="0 0 40 20">
  <defs>
    <!-- Geometric diamond pattern inspired by traditional Indian architectural jali & border motifs -->
  </defs>
  <!-- Background transparent / neutral -->
  <!-- Subtle diamond lines stroke #C9D2E0 (Pattern Grey-Blue) -->
  <path d="M 0 10 L 10 0 L 20 10 L 10 20 Z" fill="none" stroke="#C9D2E0" stroke-width="0.8" opacity="0.85"/>
  <path d="M 20 10 L 30 0 L 40 10 L 30 20 Z" fill="none" stroke="#C9D2E0" stroke-width="0.8" opacity="0.85"/>
  
  <!-- Outer diamond connectors -->
  <path d="M 10 0 L 20 10 L 30 0" fill="none" stroke="#C9D2E0" stroke-width="0.5" opacity="0.5"/>
  <path d="M 10 20 L 20 10 L 30 20" fill="none" stroke="#C9D2E0" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="10" x2="40" y2="10" stroke="#C9D2E0" stroke-width="0.4" stroke-dasharray="1 3" opacity="0.6"/>

  <!-- Tiny saffron accent dots at cardinal points -->
  <circle cx="10" cy="10" r="1.2" fill="#DFA04B"/>
  <circle cx="30" cy="10" r="1.2" fill="#DFA04B"/>
  <circle cx="20" cy="0" r="0.9" fill="#DFA04B" opacity="0.85"/>
  <circle cx="20" cy="20" r="0.9" fill="#DFA04B" opacity="0.85"/>
  <circle cx="0" cy="10" r="0.8" fill="#DFA04B" opacity="0.5"/>
  <circle cx="40" cy="10" r="0.8" fill="#DFA04B" opacity="0.5"/>
</svg>

